name: Diagnostico 4 Documentos IFSertaoPE
on:
  workflow_dispatch:
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4
      - name: Testar extracao de documentos IFSertaoPE
        run: python diagnostico_documentos_ifsertaope.py
