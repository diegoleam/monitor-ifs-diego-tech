name: Diagnostico Detalhes IFSertaoPE
on:
  workflow_dispatch:
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4
      - name: Testar paginas individuais IFSertaoPE
        run: python diagnostico_detalhes_ifsertaope.py
