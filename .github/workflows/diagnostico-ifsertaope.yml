name: Diagnostico IFSertaoPE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar requests
        run: python -m pip install requests
      - name: Testar acessos IFSertaoPE
        run: python diagnostico_ifsertaope.py
