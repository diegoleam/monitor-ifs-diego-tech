
name: Monitor IFs Diego Tech - Automatico

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-ifs-automatico
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Diagnosticar execucao
        env:
          EVENTO: ${{ github.event_name }}
          AGENDAMENTO: ${{ github.event.schedule }}
          EXECUCAO: ${{ github.run_number }}
        run: |
          echo "======================================"
          echo "MONITOR IFs DIEGO TECH"
          echo "======================================"
          echo "Evento: $EVENTO"
          echo "Agendamento: $AGENDAMENTO"
          echo "Execucao: $EXECUCAO"
          echo "Horario UTC: $(date -u '+%d/%m/%Y %H:%M:%S')"
          echo "Horario Brasilia: $(TZ=America/Recife date '+%d/%m/%Y %H:%M:%S')"
          echo "======================================"

      - name: Monitorar os tres portais
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m monitor.main --mode monitor --portal all

      - name: Salvar historico atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza historico do Monitor IFs [skip ci]"
            git push
          fi
